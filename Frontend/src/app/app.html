<nav id="mainNav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-header">
  <div class="container-fluid px-4">
    <a class="navbar-brand brand-logo" routerLink="/">
      <i class="bi bi-heart-pulse-fill"></i>
      <span>SIGA-PET</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" *ngIf="authService.isAdmin()">
          <a class="nav-link text-primary fw-bold" routerLink="/admin" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-1"></i>Painel
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/produtos" routerLinkActive="active">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/servicos" routerLinkActive="active">Serviços</a>
        </li>

        <li class="nav-item" *ngIf="authService.isUser() && !authService.isAdmin()">
          <a class="nav-link" routerLink="/agenda/novo" routerLinkActive="active">
            <i class="bi bi-calendar-plus me-1"></i>Agendar
          </a>
        </li>

        <li class="nav-item dropdown" *ngIf="authService.isAdmin()">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            Gerenciar
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" routerLink="/tutores"><i class="bi bi-people me-2"></i>Tutores</a></li>
            <li><a class="dropdown-item" routerLink="/pets"><i class="bi bi-heart me-2"></i>Pets</a></li>
            <li><a class="dropdown-item" routerLink="/produtos"><i class="bi bi-box-seam me-2"></i>Produtos (Admin)</a></li>
            <li><a class="dropdown-item" routerLink="/servicos"><i class="bi bi-scissors me-2"></i>Serviços (Admin)</a></li>
            <li><a class="dropdown-item" routerLink="/agenda"><i class="bi bi-calendar-check me-2"></i>Agenda Geral</a></li>
            <li><a class="dropdown-item" routerLink="/fornecedores"><i class="bi bi-truck me-2"></i>Fornecedores</a></li>
          </ul>
        </li>
      </ul>

      <div class="search-container mx-lg-4 mb-3 mb-lg-0 flex-grow-1" *ngIf="!authService.isAdmin()">
        <div class="search-wrapper">
          <i class="bi bi-search search-icon"></i>
          <input type="text" class="form-control search-input" placeholder="Buscar produtos..."
                 [(ngModel)]="searchQuery" (keyup.enter)="searchProducts()">
          <button class="btn-search" (click)="searchProducts()" *ngIf="searchQuery">
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </div>

      <div class="auth-buttons ms-lg-auto">
        <a *ngIf="!authService.isAuthenticated()" class="btn btn-login" routerLink="/login">
          <i class="bi bi-person-circle me-1"></i> Entrar
        </a>

        <div class="dropdown" *ngIf="authService.isAuthenticated()">
          <button class="btn btn-user dropdown-toggle" type="button" data-bs-toggle="dropdown" [class.btn-admin]="authService.isAdmin()">
            <i class="bi bi-person-circle me-1"></i>
            {{ currentUser()?.nome?.split(' ')[0] }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">Olá, {{ currentUser()?.nome }}</h6></li>

            <li *ngIf="!authService.isAdmin()">
              <a class="dropdown-item" routerLink="/agenda/novo">Meus Agendamentos</a>
            </li>

            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item text-danger" href="#" (click)="logout($event)">
                <i class="bi bi-box-arrow-right me-2"></i>Sair
              </a>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>

<main><router-outlet /></main>
