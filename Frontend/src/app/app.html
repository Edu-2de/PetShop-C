<!-- Cabeçalho (Navbar) do Bootstrap -->
<nav id="mainNav" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-header">
  <div class="container-fluid px-4">
    <!-- Brand/Logo -->
    <a class="navbar-brand brand-logo" routerLink="/">
      <i class="bi bi-heart-pulse-fill"></i>
      <span>SIGA-PET</span>
    </a>

    <!-- Botão Toggler (Hamburguer) para telas pequenas -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links da Navegação -->
    <div class="collapse navbar-collapse" id="navbarNav">
      
      <!-- Menu para Usuários NÃO autenticados ou Usuários Comuns -->
      <div *ngIf="!authService.isAdmin()" class="d-flex flex-column flex-lg-row align-items-lg-center w-100">
        
        <!-- Menu de navegação -->
        <ul class="navbar-nav mb-3 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
              Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/produtos" routerLinkActive="active">
              Produtos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/servicos" routerLinkActive="active">
              Serviços
            </a>
          </li>
          <li class="nav-item" *ngIf="authService.isUser()">
            <a class="nav-link" routerLink="/agenda/novo" routerLinkActive="active">
              Agendar
            </a>
          </li>
        </ul>

        <!-- Barra de Pesquisa (centralizada) -->
        <div class="search-container mx-lg-4 mb-3 mb-lg-0 flex-grow-1">
          <div class="search-wrapper">
            <i class="bi bi-search search-icon"></i>
            <input 
              type="text" 
              class="form-control search-input" 
              placeholder="Buscar produtos..."
              [(ngModel)]="searchQuery"
              (keyup.enter)="searchProducts()">
            <button class="btn-search" (click)="searchProducts()" *ngIf="searchQuery">
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Botão de Login/User -->
        <div class="auth-buttons ms-lg-auto">
          <!-- Se NÃO estiver autenticado -->
          <a *ngIf="!authService.isAuthenticated()" 
             class="btn btn-login" 
             routerLink="/login">
            <i class="bi bi-person-circle me-1"></i>
            Entrar
          </a>

          <!-- Se ESTIVER autenticado -->
          <div class="dropdown" *ngIf="authService.isAuthenticated()">
            <button class="btn btn-user dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ currentUser()?.nome }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <span class="dropdown-item-text text-muted small">
                  Usuário
                </span>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" href="#" (click)="logout($event)">
                  <i class="bi bi-box-arrow-right me-2"></i>Sair
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Menu para Usuários ADMIN -->
      <div *ngIf="authService.isAdmin()" class="d-flex flex-column flex-lg-row align-items-lg-center w-100">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin" routerLinkActive="active">
              <i class="bi bi-speedometer2 me-1"></i>Painel Admin
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-gear me-1"></i>Gerenciar
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" routerLink="/tutores">
                <i class="bi bi-people me-2"></i>Tutores
              </a></li>
              <li><a class="dropdown-item" routerLink="/pets">
                <i class="bi bi-heart me-2"></i>Pets
              </a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" routerLink="/produtos">
                <i class="bi bi-box-seam me-2"></i>Produtos
              </a></li>
              <li><a class="dropdown-item" routerLink="/servicos">
                <i class="bi bi-scissors me-2"></i>Serviços
              </a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" routerLink="/agenda">
                <i class="bi bi-calendar-check me-2"></i>Agenda
              </a></li>
              <li><a class="dropdown-item" routerLink="/fornecedores">
                <i class="bi bi-truck me-2"></i>Fornecedores
              </a></li>
            </ul>
          </li>
        </ul>

        <div class="dropdown ms-auto">
          <button class="btn btn-admin dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle me-1"></i>
            {{ currentUser()?.nome }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text text-muted small">
                Administrador
              </span>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="#" (click)="logout($event)">
                <i class="bi bi-box-arrow-right me-2"></i>Sair
              </a>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</nav>

<!-- Conteúdo Principal da Aplicação -->
<main><router-outlet /></main>
