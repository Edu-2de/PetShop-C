<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-light py-3">
      <h2 class="mb-0">{{ isEdit ? 'Editar Categoria' : 'Nova Categoria' }}</h2>
    </div>
    <div class="card-body">
      <form #form="ngForm" (ngSubmit)="salvar()">
        <div class="mb-3">
          <label for="nome" class="form-label">Nome da Categoria</label>
          <input type="text" id="nome" class="form-control" [(ngModel)]="categoria.nome" name="nome" required minlength="3" #nome="ngModel">
          <div *ngIf="nome.invalid && (nome.dirty || nome.touched)" class="text-danger mt-1 small">
            <div *ngIf="nome.errors?.['required']">O nome é obrigatório.</div>
            <div *ngIf="nome.errors?.['minlength']">O nome deve ter no mínimo 3 caracteres.</div>
          </div>
        </div>
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição (Opcional)</label>
          <textarea id="descricao" class="form-control" [(ngModel)]="categoria.descricao" name="descricao" rows="3"></textarea>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a routerLink="/categorias" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
