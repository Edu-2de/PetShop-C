<div class="row g-4">
  <div *ngIf="produtosCarregando" class="col-12 text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>

  <div *ngIf="!produtosCarregando && produtos.length === 0" class="col-12 text-center py-5">
    <p class="text-muted">Nenhum produto em destaque no momento.</p>
  </div>

  <div class="col-md-3 col-sm-6" *ngFor="let produto of produtos">
    <div class="card h-100 shadow-sm border-0 product-card">

      <a [routerLink]="['/produtos', produto.id]" style="cursor: pointer;">
        <div class="position-relative" style="height: 200px; overflow: hidden;">
          <img [src]="getImagem(produto)" class="card-img-top w-100 h-100" style="object-fit: cover;" [alt]="produto.nome">

          <div class="position-absolute top-0 end-0 p-2" *ngIf="produto.quantidadeEstoque < 5">
            <span class="badge bg-danger">Últimas Unidades</span>
          </div>
        </div>
      </a>

      <div class="card-body d-flex flex-column">
        <a [routerLink]="['/produtos', produto.id]" class="text-decoration-none text-dark">
          <h5 class="card-title text-truncate" [title]="produto.nome" style="cursor: pointer;">
            {{ produto.nome }}
          </h5>
        </a>

        <p class="card-text text-muted small flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
          {{ produto.descricao }}
        </p>

        <div class="mt-3 d-flex justify-content-between align-items-center">
          <span class="h5 mb-0 text-primary fw-bold">{{ produto.preco | currency:'BRL' }}</span>

          <a [routerLink]="['/produtos', produto.id]" class="btn btn-outline-primary btn-sm rounded-pill">
            Ver Detalhes
          </a>
        </div>
      </div>

    </div>
  </div>
</div>
