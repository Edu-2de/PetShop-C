<div class="container mt-5 mb-5 fade-in-up" *ngIf="produto(); else loading">

  <nav aria-label="breadcrumb" class="mb-4">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/" class="text-decoration-none">Início</a></li>
      <li class="breadcrumb-item"><a routerLink="/produtos" class="text-decoration-none">Loja</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ produto()?.nome }}</li>
    </ol>
  </nav>

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
    <div class="row g-0">

      <div class="col-md-6 bg-white d-flex align-items-center justify-content-center p-5 border-end-md">
        <img [src]="imagemPrincipal()"
             class="img-fluid rounded-3"
             style="max-height: 450px; object-fit: contain;"
             [alt]="produto()?.nome"
             (error)="handleImageError($event)">
      </div>

      <div class="col-md-6 p-4 p-lg-5 d-flex flex-column">

        <div class="mb-auto">
          <span class="badge bg-primary-subtle text-primary mb-2 px-3 py-2 rounded-pill">
            {{ produto()?.categoria || 'Geral' }}
          </span>
          <h1 class="fw-bold text-dark mb-3">{{ produto()?.nome }}</h1>

          <div class="d-flex align-items-center gap-3 mb-4">
            <h2 class="text-primary fw-bold mb-0 display-6">{{ produto()?.preco | currency:'BRL' }}</h2>
            <span class="badge bg-success" *ngIf="produto()!.quantidadeEstoque > 0">Em Estoque</span>
            <span class="badge bg-danger" *ngIf="produto()!.quantidadeEstoque === 0">Esgotado</span>
          </div>

          <p class="text-muted lead" style="font-size: 1rem;">
            {{ produto()?.descricao }}
          </p>

          <hr class="my-4 opacity-10">

          <div class="d-flex align-items-center gap-3 mb-4" *ngIf="produto()!.quantidadeEstoque > 0">
            <span class="fw-bold text-secondary">Quantidade:</span>
            <div class="input-group" style="width: 140px;">
              <button class="btn btn-outline-secondary" (click)="dec()">-</button>
              <input type="text" class="form-control text-center border-secondary bg-white" [value]="quantidade()" readonly>
              <button class="btn btn-outline-secondary" (click)="inc()">+</button>
            </div>
          </div>
        </div>

        <div class="d-grid gap-3">
          <button class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm"
                  (click)="comprar()"
                  [disabled]="produto()!.quantidadeEstoque === 0">
            <i class="bi bi-cart-plus me-2"></i> Adicionar ao Carrinho
          </button>

          <a routerLink="/produtos" class="btn btn-light btn-lg rounded-pill text-muted">
            Continuar Comprando
          </a>
        </div>

      </div>
    </div>
  </div>

</div>

<ng-template #loading>
  <div class="text-center py-5 mt-5">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p class="mt-3 text-muted">Carregando detalhes do produto...</p>
  </div>
</ng-template>
