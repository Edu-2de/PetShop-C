<div class="container mt-4 mb-5">
  <div class="card shadow-sm">
    <div class="card-header bg-light py-3">
      <h2 class="mb-0">{{ titulo }}</h2>
    </div>
    <div class="card-body">
      <form (ngSubmit)="salvar()">
        <div class="mb-3">
          <label for="nome" class="form-label fw-bold">Nome do Produto</label>
          <input type="text" class="form-control" id="nome" name="nome" [(ngModel)]="produto.nome" required placeholder="Ex: Ração Premium">
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="categoria" class="form-label fw-bold">Categoria</label>
            <select class="form-select" id="categoria" name="categoria" [(ngModel)]="produto.categoriaId">
              <option [ngValue]="undefined">Selecione uma categoria</option>
              <option *ngFor="let cat of categorias" [value]="cat.id">
                {{ cat.nome }}
              </option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label for="preco" class="form-label fw-bold">Preço</label>
            <div class="input-group">
              <span class="input-group-text">R$</span>
              <input type="number" class="form-control" id="preco" name="preco" [(ngModel)]="produto.preco" required step="0.01">
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="estoque" class="form-label fw-bold">Estoque</label>
            <input type="number" class="form-control" id="estoque" name="estoque" [(ngModel)]="produto.quantidadeEstoque" required>
          </div>

          <div class="col-md-6 mb-3">
            <label for="fornecedor" class="form-label fw-bold">Fornecedor</label>
            <select class="form-select" id="fornecedor" [(ngModel)]="produto.fornecedorid" name="fornecedorid" required>
              <option [ngValue]="0" disabled>Selecione um fornecedor</option>
              <option *ngFor="let f of fornecedores" [value]="f.id">
                {{ f.nome }}
              </option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label for="descricao" class="form-label fw-bold">Descrição</label>
          <textarea class="form-control" id="descricao" name="descricao" rows="3" [(ngModel)]="produto.descricao"></textarea>
        </div>

        <div class="mb-4 p-3 bg-light rounded border">
          <label class="form-label fw-bold mb-2">Imagem do Produto</label>

          <div class="d-flex align-items-center gap-4">
            <div class="position-relative bg-white border rounded d-flex align-items-center justify-content-center"
                 style="width: 100px; height: 100px; overflow: hidden;">
              <img [src]="previewUrl || (produto.imagens?.[0]?.url ? produto.imagens![0].url : 'assets/images/no-image.png')"
                   class="w-100 h-100 object-fit-cover"
                   alt="Preview">
            </div>

            <div class="flex-grow-1">
              <input type="file"
                     class="form-control"
                     id="fileInput"
                     (change)="onFileSelect($event)"
                     accept="image/*">
              <div class="form-text mt-2">
                Selecione uma imagem (JPG ou PNG). Ela será salva automaticamente ao clicar em Salvar.
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="uploading" class="progress mb-3">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 100%">Enviando imagem...</div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <a routerLink="/produtos" class="btn btn-secondary me-2">Cancelar</a>
          <button type="submit" class="btn btn-primary px-4" [disabled]="uploading">
            {{ uploading ? 'Salvando...' : 'Salvar Produto' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
