<div class="container mt-4 mb-5 fade-in-up">
  <div class="card shadow-sm border-0">

    <div class="card-header bg-white py-3">
      <h2 class="h5 mb-0 fw-bold text-primary">
        <i class="bi bi-calendar-plus me-2"></i>{{ titulo }}
      </h2>
      <p class="text-muted small mb-0" *ngIf="isCliente">
        Preencha os dados abaixo para marcar seu horário.
      </p>
    </div>

    <div class="card-body p-4">
      <div class="alert alert-danger" *ngIf="erroMsg">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ erroMsg }}
      </div>

      <form (ngSubmit)="salvar()">

        <div class="mb-4 border-bottom pb-4">
          <h6 class="fw-bold text-secondary text-uppercase small mb-3">1. Quem será atendido?</h6>

          <div class="d-flex gap-3 mb-3" *ngIf="isCliente && pets.length > 0">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="petMode" [checked]="!precisaCadastrarPet" (change)="toggleNovoPet()" id="petExistente">
              <label class="form-check-label" for="petExistente">Escolher meu Pet</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="petMode" [checked]="precisaCadastrarPet" (change)="toggleNovoPet()" id="petNovo">
              <label class="form-check-label" for="petNovo">Cadastrar Novo Pet</label>
            </div>
          </div>

          <div *ngIf="!precisaCadastrarPet">
            <label for="pet" class="form-label">Selecione o Pet</label>
            <select id="pet" name="pet" class="form-select" [(ngModel)]="agendamento.petid" [required]="!precisaCadastrarPet">
              <option [ngValue]="undefined" disabled>Selecione...</option>
              <option *ngFor="let p of pets" [value]="p.id">{{ p.nome }} ({{ p.raca || p.especie }})</option>
            </select>
            <div *ngIf="pets.length === 0 && !isCliente" class="form-text text-danger">
              Nenhum pet cadastrado.
            </div>
          </div>

          <div *ngIf="precisaCadastrarPet" class="bg-light p-3 rounded border animate-fade">
            <p class="small text-primary fw-bold mb-3"><i class="bi bi-plus-circle me-1"></i> Novo Cadastro de Pet</p>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small">Nome do Pet</label>
                <input type="text" class="form-control" [(ngModel)]="novoPet.nome" name="nomePet" required placeholder="Ex: Rex">
              </div>
              <div class="col-md-3">
                <label class="form-label small">Espécie</label>
                <select class="form-select" [(ngModel)]="novoPet.especie" name="especiePet" required>
                  <option value="Cão">Cão</option>
                  <option value="Gato">Gato</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Raça</label>
                <input type="text" class="form-control" [(ngModel)]="novoPet.raca" name="racaPet" placeholder="Ex: Vira-lata">
              </div>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <h6 class="fw-bold text-secondary text-uppercase small mb-3">2. Detalhes do Atendimento</h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="servico" class="form-label">Serviço Desejado</label>
              <select id="servico" name="servico" class="form-select" [(ngModel)]="agendamento.servicoId" required>
                <option [ngValue]="undefined" disabled>Escolha o serviço...</option>
                <option *ngFor="let servico of servicos" [value]="servico.id">
                  {{ servico.nome }} - {{ servico.preco | currency:'BRL' }}
                </option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="data" class="form-label">Data e Hora Preferida</label>
              <input type="datetime-local" class="form-control" id="data" name="data" [(ngModel)]="agendamento.data" required>
            </div>
          </div>
        </div>

        <div class="mb-3" *ngIf="!isCliente">
          <label for="status" class="form-label">Status (Admin)</label>
          <select id="status" name="status" class="form-select" [(ngModel)]="agendamento.status">
            <option value="Pendente">Pendente</option>
            <option value="Confirmado">Confirmado</option>
            <option value="EmAndamento">Em Andamento</option>
            <option value="Concluido">Concluído</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="observacoes" class="form-label">Observações / Sintomas</label>
          <textarea class="form-control" id="observacoes" name="observacoes" rows="3"
                    [(ngModel)]="agendamento.observacoes"
                    placeholder="Descreva algo importante sobre o pet ou o serviço..."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/" class="btn btn-light border">Cancelar</a>
          <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
            <i class="bi bi-check-lg me-1"></i> Confirmar Agendamento
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
