<section class="hero-section fade-in" style="margin-top: 3%;">
  <div class="hero-content">
    <h1 class="hero-title">SIGA-PET</h1>
    <p class="hero-subtitle">Cuidamos do seu melhor amigo com produtos de qualidade e serviços especializados. Tudo o que ele precisa, em um só lugar.</p>
    <a routerLink="/produtos" class="btn-hero rounded-pill">
      Confira Nossas Ofertas
    </a>
  </div>
</section>

<section class="categories-section animate-on-scroll">
  <div class="container">
    <h2 class="section-title">Categorias</h2>
    <div class="categories-grid">
      <div class="category-card" *ngFor="let cat of categories" (click)="navigate(cat.link)">
        <div class="category-icon-wrapper">
          <i class="bi" [ngClass]="cat.icon"></i>
        </div>
        <div class="category-title">{{ cat.title }}</div>
        <div class="category-desc">{{ cat.desc }}</div>
      </div>
    </div>
  </div>
</section>

<section class="products-section animate-on-scroll bg-white">
  <div class="container">
    <div class="section-header d-flex justify-content-between align-items-center mb-5">
      <h2 class="section-title mb-0 text-start" style="text-align: left;">Destaques da Loja</h2>
      <a routerLink="/produtos" class="view-all-link">Ver todos os produtos <i class="bi bi-arrow-right"></i></a>
    </div>

    <app-card-produtos></app-card-produtos>

  </div>
</section>

<section class="features-section animate-on-scroll">
  <div class="container">
    <h2 class="section-title">Por que escolher a SIGA-PET?</h2>
    <div class="features-grid">
      <div class="feature-card slide-up" *ngFor="let f of features">
        <div class="feature-icon">
          <i class="bi" [ngClass]="f.icon"></i>
        </div>
        <div class="feature-title">{{ f.title }}</div>
        <div class="feature-desc">{{ f.desc }}</div>
      </div>
    </div>
  </div>
</section>
