<div class="register-page fade-in-up">
  <div class="register-container">
    <div class="register-card">

      <div class="text-center mb-4">
        <i class="bi bi-heart-pulse-fill text-primary fs-1 mb-2 d-block"></i>
        <h2 class="fw-bold text-dark">Crie sua conta</h2>
        <p class="text-muted small">Junte-se à família Siga-Pet</p>
      </div>

      <div class="alert alert-danger d-flex align-items-center" *ngIf="erro">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        <div>{{ erro }}</div>
      </div>

      <form (ngSubmit)="registrar()">

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Nome Completo</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" class="form-control bg-light border-start-0 ps-0"
                   placeholder="Ex: Maria Silva" [(ngModel)]="form.nome" name="nome" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">E-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
            <input type="email" class="form-control bg-light border-start-0 ps-0"
                   placeholder="seu@email.com" [(ngModel)]="form.email" name="email" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-secondary">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input [type]="mostrarSenha ? 'text' : 'password'" class="form-control bg-light border-start-0 ps-0 border-end-0"
                   placeholder="Mínimo 6 caracteres" [(ngModel)]="form.senha" name="senha" required minlength="6">
            <span class="input-group-text bg-light border-start-0 cursor-pointer" (click)="toggleSenha()">
              <i class="bi" [class.bi-eye]="!mostrarSenha" [class.bi-eye-slash]="mostrarSenha"></i>
            </span>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-secondary">Telefone / WhatsApp</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-whatsapp text-muted"></i></span>
            <input type="tel" class="form-control bg-light border-start-0 ps-0"
                   placeholder="(00) 00000-0000" [(ngModel)]="form.telefone" name="telefone">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm" [disabled]="carregando">
          {{ carregando ? 'Criando conta...' : 'Cadastrar' }}
        </button>

      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <p class="small text-muted mb-0">Já tem uma conta?</p>
        <a routerLink="/login" class="text-primary fw-bold text-decoration-none">Fazer Login</a>
      </div>

    </div>
  </div>
</div>
