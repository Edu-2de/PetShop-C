<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Lista de Fornecedores</h2>
      <button routerLink="/fornecedores/novo" class="btn btn-primary">Novo Fornecedor</button>
    </div>
    <div class="card-body">
      <input type="text" class="form-control mb-3" placeholder="Buscar por nome..." (input)="buscar($event)">
      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nome</th>
            <th scope="col">CNPJ</th>
            <th scope="col">Telefone</th>
            <th scope="col">Email</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let fornecedor of fornecedoresFiltrados()">
            <th scope="row">{{ fornecedor.id }}</th>
            <td>{{ fornecedor.nome }}</td>
            <td>{{ fornecedor.cnpj }}</td>
            <td>{{ fornecedor.telefone }}</td>
            <td>{{ fornecedor.email }}</td>
            <td>
              <button [routerLink]="['/fornecedores/editar', fornecedor.id]" class="btn btn-sm btn-primary me-2">Editar</button>
              <button (click)="excluir(fornecedor.id)" class="btn btn-sm btn-danger">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
