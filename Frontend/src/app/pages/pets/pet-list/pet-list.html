<div class="container fade-in">
  <div class="card shadow-sm">

    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
      <div>
        <h5 class="mb-0 fw-bold text-dark">Pets Cadastrados</h5>
        <p class="text-muted small mb-0">Gerencie os animais da clínica</p>
      </div>

      <div class="d-flex gap-2">
        <div class="input-group" style="width: 250px;">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control bg-light border-start-0"
                 placeholder="Buscar pet..." [value]="termoBusca()" (input)="buscar($event)">
        </div>
        <a routerLink="/pets/novo" class="btn btn-primary d-flex align-items-center">
          <i class="bi bi-plus-lg me-2"></i> Novo Pet
        </a>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th class="ps-4">Nome</th>
            <th>Espécie/Raça</th>
            <th>Tutor</th>
            <th>Nascimento</th>
            <th class="text-end pe-4">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="petsFiltrados().length === 0">
            <td colspan="5" class="text-center py-5">
              <div class="text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                Nenhum pet encontrado.
              </div>
            </td>
          </tr>

          <tr *ngFor="let pet of petsFiltrados()">
            <td class="ps-4">
              <div class="d-flex align-items-center">
                <div class="avatar-sm bg-light rounded-circle d-flex align-items-center justify-content-center text-primary fw-bold me-3" style="width: 40px; height: 40px;">
                  {{ pet.nome.charAt(0) }}
                </div>
                <span class="fw-semibold text-dark">{{ pet.nome }}</span>
              </div>
            </td>
            <td>
              <span class="badge bg-light text-dark border">{{ pet.especie }}</span>
              <small class="text-muted ms-2">{{ pet.raca }}</small>
            </td>
            <td>
              <a [routerLink]="['/tutores']" class="text-decoration-none text-primary fw-medium">
                {{ pet.tutor?.nome || 'Sem tutor' }}
              </a>
            </td>
            <td class="text-muted">{{ pet.nascimento | date:'dd/MM/yyyy' }}</td>
            <td class="text-end pe-4">
              <a [routerLink]="['/pets/editar', pet.id]" class="btn btn-sm btn-light text-primary me-2" title="Editar">
                <i class="bi bi-pencil"></i>
              </a>
              <button (click)="excluir(pet.id)" class="btn btn-sm btn-light text-danger" title="Excluir">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
