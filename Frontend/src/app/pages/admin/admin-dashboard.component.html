<div class="admin-container fade-in">

  <header class="admin-header mb-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center pb-3 border-bottom">
        <div>
          <span class="text-uppercase text-muted small fw-bold ls-1">Dashboard</span>
          <h1 class="display-6 fw-bold text-dark mb-0">Visão Geral</h1>
        </div>
        <div class="d-none d-md-block text-end">
          <p class="mb-0 fw-bold text-secondary">{{ dataAtual | date:'d MMMM, y' }}</p>
        </div>
      </div>
    </div>
  </header>

  <div class="container pb-5">

    <div class="row g-4 mb-5">
      <div class="col-md-6 col-xl-3" *ngFor="let stat of statsCards">
        <div class="metric-card p-4 bg-white rounded-4 shadow-sm h-100 border">
          <div class="d-flex justify-content-between mb-3">
            <p class="text-secondary fw-medium small mb-0 text-uppercase">{{ stat.title }}</p>
            <i [class]="'bi ' + stat.icon + ' text-secondary fs-5'"></i>
          </div>
          <h2 class="fw-bold text-dark mb-2">{{ stat.value }}</h2>
          <p class="text-muted small mb-0" style="line-height: 1.4;">
            {{ stat.description }}
          </p>
        </div>
      </div>
    </div>

    <h5 class="fw-bold text-dark mb-4 ps-1">Acesso Rápido</h5>
    <div class="row g-3">
      <div class="col-md-6 col-lg-4" *ngFor="let item of menuCards">
        <a [routerLink]="item.link" class="text-decoration-none">
          <div class="nav-card bg-white p-4 rounded-4 shadow-sm border h-100 d-flex align-items-center transition-hover">
            <div class="icon-box rounded-3 bg-light text-dark d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px;">
              <i [class]="'bi ' + item.icon + ' fs-5'"></i>
            </div>
            <div>
              <h6 class="fw-bold text-dark mb-1">{{ item.title }}</h6>
              <p class="text-muted small mb-0 text-truncate" style="max-width: 200px;">{{ item.desc }}</p>
            </div>
            <div class="ms-auto text-muted opacity-50">
              <i class="bi bi-chevron-right small"></i>
            </div>
          </div>
        </a>
      </div>
    </div>

  </div>
</div>
