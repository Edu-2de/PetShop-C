<div class="container py-5">
  <div class="admin-header mb-5">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1 class="display-5 fw-bold mb-2">
          <i class="bi bi-speedometer2 text-primary me-3"></i>
          Painel Administrativo
        </h1>
        <p class="text-muted lead">Bem-vindo, {{ user()?.nome }}!</p>
      </div>
      <div class="col-md-4 text-md-end">
        <a routerLink="/" class="btn btn-outline-primary me-2">
          <i class="bi bi-house-door me-2"></i>Ir para Home
        </a>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let card of adminCards">
      <div class="card admin-card h-100 border-0 shadow-sm">
        <div class="card-body text-center p-4">
          <div class="icon-wrapper mb-3" [class]="'bg-' + card.color">
            <i class="bi" [class]="card.icon"></i>
          </div>
          <h5 class="card-title fw-bold mb-2">{{ card.title }}</h5>
          <p class="card-text text-muted mb-4">{{ card.description }}</p>
          <a [routerLink]="card.link" class="btn btn-sm" [class]="'btn-' + card.color">
            Acessar <i class="bi bi-arrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="alert alert-info mt-5 border-0 shadow-sm">
    <i class="bi bi-info-circle-fill me-2"></i>
    <strong>Área Administrativa:</strong> Aqui você tem acesso completo a todas as funcionalidades de gerenciamento do sistema.
  </div>
</div>
