<div class="admin-wrapper fade-in">

  <div class="dashboard-header mb-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-end">
        <div>
          <h6 class="text-uppercase text-muted small fw-bold mb-1">Visão Geral</h6>
          <h1 class="fw-bold text-dark mb-0">Painel Administrativo</h1>
        </div>
        <div class="date-badge d-none d-md-block">
          <i class="bi bi-calendar-event me-2"></i> {{ user()?.nome }}
        </div>
      </div>
    </div>
  </div>

  <div class="container pb-5">

    <div class="row g-4 mb-5">
      <div class="col-md-3 col-sm-6" *ngFor="let stat of statsCards">
        <div class="card border-0 shadow-sm stat-card h-100">
          <div class="card-body p-4 d-flex align-items-center justify-content-between">
            <div>
              <h6 class="text-muted text-uppercase small fw-semibold mb-2">{{ stat.title }}</h6>
              <h3 class="fw-bold mb-0 text-dark">{{ stat.value }}</h3>
            </div>
            <div class="icon-circle bg-light text-{{ stat.color }}">
              <i class="bi" [ngClass]="stat.icon"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h5 class="mb-4 fw-bold text-secondary border-bottom pb-2">Acesso Rápido</h5>
    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let item of menuCards">
        <a [routerLink]="item.link" class="text-decoration-none">
          <div class="card menu-card h-100 border-0 shadow-sm">
            <div class="card-body p-4 d-flex align-items-start">
              <div class="menu-icon me-3 text-secondary">
                <i class="bi" [ngClass]="item.icon"></i>
              </div>
              <div>
                <h5 class="card-title fw-bold text-dark mb-1">{{ item.title }}</h5>
                <p class="card-text text-muted small mb-0">{{ item.desc }}</p>
              </div>
              <div class="ms-auto align-self-center opacity-0 arrow-icon">
                <i class="bi bi-chevron-right text-primary"></i>
              </div>
            </div>
          </div>
        </a>
      </div>
    </div>

  </div>
</div>
